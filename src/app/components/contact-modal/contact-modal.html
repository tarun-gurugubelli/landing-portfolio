@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center">
    <!-- Backdrop -->
    <div
      class="absolute inset-0 bg-black/50 dark:bg-white/10 backdrop-blur-sm transition-opacity duration-300"
      (click)="close()"
    ></div>

    <!-- Modal -->
    <div class="relative bg-white dark:bg-black border-2 border-gray-200 dark:border-gray-800 rounded-2xl p-8 max-w-md w-full mx-4 shadow-2xl transform transition-all duration-300 scale-100">
      <!-- Close Button -->
      <button
        (click)="close()"
        class="absolute top-4 right-4 p-2 text-gray-500 hover:text-black dark:hover:text-white transition-colors duration-200"
        aria-label="Close modal"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>

      <!-- Header -->
      <div class="text-center mb-8">
        <h3 class="text-2xl font-bold text-black dark:text-white mb-2">Let's Connect</h3>
        <p class="text-gray-600 dark:text-gray-400">Choose your preferred way to get in touch</p>
      </div>

      <!-- Connection Options -->
      <div class="space-y-4">
        <!-- GitHub -->
        <button
          (click)="connect('github')"
          class="w-full flex items-center p-4 bg-gray-50 dark:bg-gray-900 border-2 border-gray-200 dark:border-gray-800 rounded-lg hover:border-black dark:hover:border-white transition-all duration-300 group"
        >
          <div class="p-2 bg-black dark:bg-white rounded-full mr-4 group-hover:scale-110 transition-transform duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white dark:text-black">
              <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
              <path d="M9 18c-4.51 2-5-2-7-2"/>
            </svg>
          </div>
          <div class="text-left">
            <h4 class="font-semibold text-black dark:text-white">GitHub</h4>
            <p class="text-sm text-gray-600 dark:text-gray-400">View my code and projects</p>
          </div>
        </button>

        <!-- LinkedIn -->
        <button
          (click)="connect('linkedin')"
          class="w-full flex items-center p-4 bg-gray-50 dark:bg-gray-900 border-2 border-gray-200 dark:border-gray-800 rounded-lg hover:border-black dark:hover:border-white transition-all duration-300 group"
        >
          <div class="p-2 bg-black dark:bg-white rounded-full mr-4 group-hover:scale-110 transition-transform duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white dark:text-black">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
              <rect width="4" height="12" x="2" y="9"/>
              <circle cx="4" cy="4" r="2"/>
            </svg>
          </div>
          <div class="text-left">
            <h4 class="font-semibold text-black dark:text-white">LinkedIn</h4>
            <p class="text-sm text-gray-600 dark:text-gray-400">Professional networking</p>
          </div>
        </button>

        <!-- Email -->
        <button
          (click)="connect('email')"
          class="w-full flex items-center p-4 bg-gray-50 dark:bg-gray-900 border-2 border-gray-200 dark:border-gray-800 rounded-lg hover:border-black dark:hover:border-white transition-all duration-300 group"
        >
          <div class="p-2 bg-black dark:bg-white rounded-full mr-4 group-hover:scale-110 transition-transform duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white dark:text-black">
              <rect width="20" height="16" x="2" y="4" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </div>
          <div class="text-left">
            <h4 class="font-semibold text-black dark:text-white">Email</h4>
            <p class="text-sm text-gray-600 dark:text-gray-400">Direct communication</p>
          </div>
        </button>
      </div>
    </div>
  </div>
}
